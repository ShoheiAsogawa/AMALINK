<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>AMALINK 管理</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #0ea5e9;
      --blue-deep: #0369a1;
      --green: #059669;
      --ink: #1c2430;
      --muted: #6b7280;
      --line: #e6e4e1;
      --bg: #f6f5f3;
      --panel: #ffffff;
      --danger: #be123c;
      --serif: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif JP", serif;
      --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", YuGothic, "Noto Sans JP", sans-serif;
      --shadow: 0 24px 60px rgba(28, 36, 48, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--sans);
      letter-spacing: 0.01em;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.45; cursor: default; }
    :focus-visible { outline: 2px solid rgba(14, 165, 233, 0.7); outline-offset: 2px; }
    .hidden { display: none !important; }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 16px;
      min-height: 64px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo { height: 36px; width: auto; flex: none; display: block; }
    .brand strong { display: block; font-size: 14px; letter-spacing: 0.14em; font-weight: 700; }
    .brand small { color: var(--muted); font-size: 12px; font-weight: 500; }
    .top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .save-state { color: var(--muted); font-size: 12px; min-width: 6em; text-align: right; }
    .btn, .btn-ghost, .btn-danger, .text-btn {
      height: 36px; padding: 0 14px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      text-decoration: none; font-size: 13px; font-weight: 650;
    }
    .btn { border: 0; background: #123044; color: white; }
    .btn:hover { background: #0c2534; }
    .btn-ghost { background: white; color: var(--ink); border: 1px solid var(--line); }
    .btn-ghost:hover { border-color: #cbd5e1; }
    .btn-danger { background: white; color: var(--danger); border: 1px solid #fecdd3; }
    .text-btn { border: 0; background: transparent; color: var(--muted); padding: 0 8px; }
    .text-btn:hover { background: #f3f1ee; color: var(--ink); }
    .gate {
      min-height: calc(100dvh - 64px);
      display: grid; place-items: center; padding: 32px 20px;
    }
    .card {
      width: min(400px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 32px 28px 28px;
    }
    .card h1 { margin: 0 0 8px; font-family: var(--serif); font-size: 32px; font-weight: 500; letter-spacing: 0.02em; }
    .lead { margin: 0 0 22px; color: var(--muted); line-height: 1.75; font-size: 14px; }
    .field { display: grid; gap: 6px; font-size: 12px; font-weight: 650; color: #4b5563; }
    input, textarea, select {
      width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 11px 12px;
    }
    input:focus, textarea:focus, select:focus { outline: 2px solid rgba(14,165,233,0.35); border-color: #7dd3fc; }
    .stack { display: grid; gap: 14px; }
    .error { min-height: 1.2em; margin: 0; color: var(--danger); font-size: 13px; }
    .workspace {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 300px;
      height: calc(100dvh - 64px);
      overflow: hidden;
    }
    .sidebar, .side {
      background: #fbfaf8;
      min-height: 0;
      overflow: auto;
    }
    .sidebar { border-right: 1px solid var(--line); padding: 16px 14px 24px; display: flex; flex-direction: column; gap: 12px; }
    .side { border-left: 1px solid var(--line); padding: 20px 16px 28px; display: grid; gap: 14px; align-content: start; }
    .stage { min-height: 0; overflow: auto; background: white; }
    .sheet { max-width: 740px; margin: 0 auto; padding: 36px 40px 80px; }
    .new-post { width: 100%; }
    .search { background: white; }
    .filters { display: flex; gap: 4px; padding: 4px; background: #efece7; border-radius: 999px; }
    .filters button {
      flex: 1; height: 30px; border: 0; border-radius: 999px; background: transparent;
      color: var(--muted); font-size: 12px; font-weight: 700;
    }
    .filters button.is-on { background: white; color: var(--ink); box-shadow: 0 1px 2px rgba(28,36,48,0.06); }
    .filters span { font-weight: 600; color: #94a3b8; }
    .filters button.is-on span { color: var(--muted); }
    .posts { display: grid; gap: 4px; align-content: start; }
    .post {
      text-align: left; width: 100%; border: 0; border-radius: 12px; background: transparent; padding: 10px 10px 10px 12px;
    }
    .post:hover { background: #f3f1ee; }
    .post.is-on { background: #e0f2fe; }
    .post b { display: block; font-weight: 650; line-height: 1.45; font-size: 14px; }
    .meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; color: var(--muted); font-size: 12px; }
    .dot { width: 7px; height: 7px; border-radius: 99px; background: #cbd5e1; flex: none; }
    .dot.live { background: var(--green); }
    .empty { padding: 28px 8px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .kicker { margin: 0 0 8px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .chip {
      display: inline-flex; margin: 0 0 14px; padding: 2px 10px; border-radius: 999px;
      background: #e0f2fe; color: var(--blue-deep); font-size: 12px; font-weight: 700;
    }
    .title {
      width: 100%; border: 0; background: transparent; border-radius: 0; padding: 0;
      font-family: var(--serif); font-size: 36px; font-weight: 500; line-height: 1.35;
      resize: none; overflow: hidden; min-height: 52px;
    }
    .title:focus { outline: none; box-shadow: inset 0 -1px 0 var(--line); }
    .editor-bar {
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
      margin: 22px 0 16px; flex-wrap: wrap;
    }
    .tools { display: flex; flex-wrap: wrap; gap: 6px; }
    .tools button, .surface button {
      height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line);
      background: #fafaf9; font-size: 12px; font-weight: 650; color: #475569;
    }
    .tools button:hover, .surface button:hover { border-color: #cbd5e1; color: var(--ink); }
    .surface { display: flex; padding: 3px; background: #f3f1ee; border-radius: 999px; }
    .surface button { border: 0; background: transparent; }
    .surface button.is-on { background: white; color: var(--ink); box-shadow: 0 1px 2px rgba(28,36,48,0.06); }
    .preview { padding: 8px 0 12px; }
    .prose { line-height: 1.9; color: #334155; font-size: 16px; }
    .prose p { margin: 0 0 1em; }
    .prose h2, .prose h3 { font-family: var(--serif); font-weight: 500; color: var(--ink); }
    .prose h2 { font-size: 22px; margin: 1.6em 0 0.5em; }
    .prose h3 { font-size: 18px; margin: 1.4em 0 0.4em; }
    .prose a { color: var(--blue-deep); }
    .prose img { width: 100%; border-radius: 16px; margin: 8px 0 16px; }
    .prose ul { padding-left: 1.2em; }
    textarea.content {
      min-height: 52vh; resize: vertical; line-height: 1.7; font-size: 13px;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      background: #fbfaf8;
    }
    .stage[data-surface="preview"] .content,
    .stage[data-surface="preview"] .html-hint { display: none; }
    .stage[data-surface="html"] .preview { display: none; }
    .hint { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .side h3 { margin: 8px 0 0; font-size: 11px; letter-spacing: 0.14em; color: var(--muted); font-weight: 700; }
    .seg { display: flex; padding: 4px; background: #efece7; border-radius: 999px; }
    .seg button { flex: 1; height: 34px; border: 0; border-radius: 999px; background: transparent; font-weight: 700; font-size: 13px; color: var(--muted); }
    .seg button.is-on { background: white; color: var(--ink); box-shadow: 0 1px 2px rgba(28,36,48,0.06); }
    .slug {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 13px; letter-spacing: 0;
    }
    .cover-drop {
      width: 100%; min-height: 148px; padding: 0; border-radius: 16px; overflow: hidden;
      border: 1px dashed #d6d3d1; background: white; color: var(--muted);
      display: grid; place-items: center; text-align: center; font-size: 13px; line-height: 1.6;
    }
    .cover-drop.is-drag { border-color: var(--blue); background: #f0f9ff; color: var(--blue-deep); }
    .cover-preview { width: 100%; height: 160px; object-fit: cover; display: block; }
    #cover-empty { padding: 18px; }
    .danger-zone { display: grid; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
    .boot { margin: 0; color: var(--muted); font-size: 14px; }
    .toast {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 40;
      background: #123044; color: white; border-radius: 999px; padding: 12px 18px;
      box-shadow: var(--shadow); font-size: 13px; max-width: calc(100% - 32px);
    }
    dialog { border: 0; border-radius: 22px; padding: 24px; width: min(420px, calc(100% - 32px)); box-shadow: var(--shadow); }
    dialog::backdrop { background: rgba(18, 24, 32, 0.4); }
    dialog h2 { margin: 0 0 8px; font-family: var(--serif); font-size: 24px; font-weight: 500; }
    dialog p { margin: 0 0 16px; color: var(--muted); line-height: 1.7; font-size: 14px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .row input { width: auto; flex: 1; min-width: 140px; }
    .dock { display: none; }
    @media (max-width: 980px) {
      .workspace { display: block; height: auto; overflow: visible; }
      .workspace .sidebar, .workspace .stage, .workspace .side { display: none; border: 0; max-height: none; }
      .workspace[data-pane="list"] .sidebar { display: flex; min-height: calc(100dvh - 128px); }
      .workspace[data-pane="edit"] .stage { display: block; }
      .workspace[data-pane="publish"] .side { display: grid; padding-bottom: 108px; }
      .sidebar { padding-bottom: 96px; }
      .sheet { padding: 24px 18px 96px; }
      .title { font-size: 26px; }
      .topbar { padding: 10px 14px; flex-wrap: wrap; }
      .brand small { display: none; }
      .brand strong { letter-spacing: 0.08em; }
      .save-state { display: none; }
      .dock {
        display: grid; grid-template-columns: repeat(3, 1fr);
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
        background: rgba(255,255,255,0.96); border-top: 1px solid var(--line);
        padding: 6px 10px calc(6px + env(safe-area-inset-bottom));
        backdrop-filter: blur(16px);
      }
      .dock button {
        height: 42px; border: 0; background: transparent; border-radius: 12px;
        color: var(--muted); font-weight: 700; font-size: 13px;
      }
      .dock button.is-on { background: #f3f1ee; color: var(--ink); }
      .toast { bottom: 74px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="https://amalink.co.jp/logo.png" alt="" width="456" height="307" />
      <div>
        <strong>AMALINK</strong>
        <small>お知らせの管理</small>
      </div>
    </div>
    <div class="top-actions" id="top-actions">
      <span id="save-state" class="save-state hidden">保存済み</span>
      <a class="btn-ghost" href="https://amalink.co.jp/news" target="_blank" rel="noreferrer">公開サイト</a>
      <button class="btn hidden" id="save" type="button" title="⌘S / Ctrl+S">保存する</button>
    </div>
  </header>

  <main id="gate" class="gate">
    <p id="boot-status" class="boot">読み込んでいます</p>
    <form class="card stack hidden" id="auth-form">
      <div>
        <h1 id="auth-title">管理画面</h1>
        <p class="lead" id="auth-lead">公開中のお知らせを、ここから編集できます。</p>
      </div>
      <label class="field">パスワード<input id="password" type="password" autocomplete="current-password" required /></label>
      <label class="field hidden" id="confirm-wrap">確認<input id="password2" type="password" autocomplete="new-password" /></label>
      <p class="error" id="auth-error" role="alert"></p>
      <button class="btn" type="submit" id="auth-submit">入る</button>
    </form>
  </main>

  <section id="app" class="workspace hidden" data-pane="edit">
    <aside class="sidebar">
      <button class="btn new-post" id="new-post" type="button">新しい記事</button>
      <input class="search" id="search" type="search" placeholder="タイトルを検索" aria-label="タイトルを検索" />
      <div class="filters" role="tablist">
        <button type="button" data-filter="all" class="is-on">すべて <span data-count="all">0</span></button>
        <button type="button" data-filter="published">公開 <span data-count="published">0</span></button>
        <button type="button" data-filter="draft">下書き <span data-count="draft">0</span></button>
      </div>
      <div class="posts" id="post-list"></div>
    </aside>

    <div class="stage" id="stage" data-surface="preview">
      <div class="sheet">
        <p class="kicker" id="preview-date"></p>
        <p class="chip" id="preview-cat"></p>
        <textarea class="title" id="title" rows="2" placeholder="タイトル"></textarea>
        <div class="editor-bar">
          <div class="tools">
            <button type="button" data-insert="p">段落</button>
            <button type="button" data-insert="h2">見出し</button>
            <button type="button" data-insert="h3">小見出し</button>
            <button type="button" data-insert="a">リンク</button>
            <button type="button" data-insert="ul">箇条書き</button>
            <button type="button" id="insert-image">画像</button>
          </div>
          <div class="surface" id="surface" role="tablist" aria-label="本文の表示">
            <button type="button" data-surface="preview" class="is-on">見た目</button>
            <button type="button" data-surface="html">HTML</button>
          </div>
        </div>
        <article class="preview" id="preview">
          <div class="prose" id="preview-body"></div>
        </article>
        <textarea class="content" id="content" placeholder="ここに本文のHTMLを書きます" aria-label="本文のHTML"></textarea>
        <p class="hint html-hint">見た目はすぐ上に反映されます。保存は ⌘S / Ctrl+S です。</p>
      </div>
    </div>

    <aside class="side">
      <h3>公開</h3>
      <div class="seg" id="status-seg" role="tablist">
        <button type="button" data-status="draft">下書き</button>
        <button type="button" data-status="published" class="is-on">公開</button>
      </div>
      <p class="hint" id="status-hint">保存すると、公開サイトに表示されます。</p>
      <label class="field">公開日<input id="published-at" type="date" /></label>
      <label class="field">アドレス
        <input class="slug" id="slug" placeholder="自動で付きます" spellcheck="false" autocapitalize="off" />
      </label>
      <p class="hint" id="slug-preview"></p>
      <label class="field">カテゴリ
        <select id="category"></select>
      </label>
      <div class="row">
        <input id="new-category" placeholder="カテゴリを追加" />
        <button class="btn-ghost" id="add-category" type="button">追加</button>
      </div>
      <h3>カバー</h3>
      <button class="cover-drop" id="upload" type="button">
        <img id="cover-preview" class="cover-preview hidden" alt="" />
        <span id="cover-empty">クリック、または画像をドロップ<br />PNG / JPEG / WebP / GIF・5MBまで</span>
      </button>
      <label class="field">画像URL<input id="cover" placeholder="https:// または /news/..." /></label>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden" />
      <div class="danger-zone">
        <a class="btn-ghost" id="open-public" href="https://amalink.co.jp/news" target="_blank" rel="noreferrer">公開ページを見る</a>
        <button class="btn-danger" id="remove" type="button">この記事を削除</button>
        <button class="text-btn hidden" id="password-open" type="button">パスワードを変更</button>
        <button class="text-btn hidden" id="logout" type="button">ログアウト</button>
      </div>
    </aside>

    <nav class="dock" aria-label="画面の切り替え">
      <button type="button" data-pane="list">一覧</button>
      <button type="button" data-pane="edit" class="is-on">編集</button>
      <button type="button" data-pane="publish">設定</button>
    </nav>
  </section>

  <dialog id="confirm">
    <h2>この記事を削除しますか？</h2>
    <p id="confirm-copy">公開ページからも消えます。この操作は戻せません。</p>
    <div class="row">
      <button class="btn-ghost" id="confirm-cancel" type="button">やめる</button>
      <button class="btn-danger" id="confirm-ok" type="button">削除する</button>
    </div>
  </dialog>

  <dialog id="leave">
    <h2>保存していない変更があります</h2>
    <p>このまま移動すると、いまの編集は失われます。</p>
    <div class="row">
      <button class="btn-ghost" id="leave-cancel" type="button">戻る</button>
      <button class="btn-ghost" id="leave-discard" type="button">破棄して移動</button>
      <button class="btn" id="leave-save" type="button">保存して移動</button>
    </div>
  </dialog>

  <dialog id="link-dialog">
    <form method="dialog" class="stack">
      <h2>リンク先</h2>
      <label class="field">URL<input id="link-url" inputmode="url" spellcheck="false" /></label>
      <div class="row">
        <button class="btn-ghost" value="cancel">やめる</button>
        <button class="btn" value="ok">入れる</button>
      </div>
    </form>
  </dialog>

  <dialog id="alt-dialog">
    <form method="dialog" id="alt-form" class="stack">
      <h2>画像の説明</h2>
      <p>読み上げや検索に使います。空のままでも追加できます。</p>
      <label class="field">説明<input id="alt-text" /></label>
      <div class="row">
        <button class="btn-ghost" value="cancel">やめる</button>
        <button class="btn" value="ok">追加する</button>
      </div>
    </form>
  </dialog>

  <dialog id="password-dialog">
    <form class="stack" id="password-form">
      <h2>パスワードを変更</h2>
      <p>10文字以上にしてください。</p>
      <label class="field">現在のパスワード<input id="pw-current" type="password" autocomplete="current-password" required /></label>
      <label class="field">新しいパスワード<input id="pw-next" type="password" autocomplete="new-password" minlength="10" required /></label>
      <p class="error" id="pw-error"></p>
      <div class="row">
        <button class="btn-ghost" id="pw-cancel" type="button">閉じる</button>
        <button class="btn" type="submit">変更する</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden" role="status"></div>

  <script>
    const PUBLIC_ORIGIN = "https://amalink.co.jp";
    const state = { posts: [], categories: [], filter: "all", currentId: null, dirty: false, status: "published", needsSetup: false };
    let caret = { start: 0, end: 0 };
    let pendingLeave = null;

    const $ = (id) => document.getElementById(id);
    const toastBox = $("toast");
    let toastTimer = 0;

    function toast(message) {
      toastBox.textContent = message;
      toastBox.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastBox.classList.add("hidden"), 2600);
    }

    async function api(path, options = {}) {
      const headers = new Headers(options.headers || {});
      if (options.body && !(options.body instanceof FormData) && !headers.has("content-type")) {
        headers.set("content-type", "application/json");
      }
      const response = await fetch(path, { ...options, headers });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(data.error || "request_failed");
        error.status = response.status;
        throw error;
      }
      return data;
    }

    function showApp(on) {
      $("gate").classList.toggle("hidden", on);
      $("app").classList.toggle("hidden", !on);
      $("logout").classList.toggle("hidden", !on);
      $("password-open").classList.toggle("hidden", !on);
      $("save").classList.toggle("hidden", !on);
      $("save-state").classList.toggle("hidden", !on);
    }

    function setPane(pane) {
      $("app").dataset.pane = pane;
      document.querySelectorAll(".dock button").forEach((button) => {
        button.classList.toggle("is-on", button.dataset.pane === pane);
      });
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function formatDay(iso) {
      if (!iso) return "";
      const [year, month, day] = iso.slice(0, 10).split("-");
      if (!year || !month || !day) return "";
      return year + "/" + month + "/" + day;
    }

    function blankPost() {
      return { id: null, title: "", slug: "", content: "", categoryId: state.categories[0]?.id || "", status: "draft", publishedAt: today() + "T00:00:00.000Z", coverUrl: "" };
    }

    function currentDraft() {
      return {
        title: $("title").value.trim(),
        slug: $("slug").value.trim(),
        content: $("content").value,
        categoryId: $("category").value,
        status: state.status,
        publishedAt: $("published-at").value ? $("published-at").value + "T00:00:00.000Z" : null,
        coverUrl: $("cover").value.trim(),
      };
    }

    function prettyHtml(html) {
      return String(html || "").replace(/></g, ">\n<").trim();
    }

    function resizeTitle() {
      const title = $("title");
      title.style.height = "auto";
      title.style.height = title.scrollHeight + "px";
    }

    function rememberCaret() {
      const area = $("content");
      caret = { start: area.selectionStart, end: area.selectionEnd };
    }

    function fill(post) {
      state.currentId = post.id;
      state.status = post.status || "draft";
      $("title").value = post.title || "";
      resizeTitle();
      $("slug").value = post.slug || "";
      $("content").value = prettyHtml(post.content || "");
      caret = { start: $("content").value.length, end: $("content").value.length };
      $("cover").value = post.coverUrl || "";
      $("published-at").value = (post.publishedAt || "").slice(0, 10) || today();
      $("category").value = post.categoryId || "";
      document.querySelectorAll("#status-seg button").forEach((button) => {
        button.classList.toggle("is-on", button.dataset.status === state.status);
      });
      const href = post.publicUrl || (post.slug ? PUBLIC_ORIGIN + "/news/" + post.slug : PUBLIC_ORIGIN + "/news");
      $("open-public").href = href;
      $("open-public").textContent = post.slug ? "この記事を見る" : "お知らせ一覧を見る";
      state.dirty = false;
      markDirty();
      renderPreview();
      renderList();
      const selected = document.querySelector(".post.is-on");
      if (selected) selected.scrollIntoView({ block: "nearest" });
    }

    function markDirty() {
      $("save-state").textContent = state.dirty ? "未保存の変更" : "保存済み";
      $("save").textContent = !state.dirty ? "保存する" : state.status === "published" ? "公開する" : "下書き保存";
      $("status-hint").textContent = state.status === "published"
        ? "保存すると、公開サイトに表示されます。"
        : "下書きのあいだは、公開サイトに出ません。";
    }

    function renderCategories() {
      const select = $("category");
      const current = select.value;
      select.innerHTML = state.categories.map((category) => `<option value="${category.id}">${escapeHtml(category.title)}</option>`).join("");
      if (current) select.value = current;
    }

    function visiblePosts() {
      const q = $("search").value.trim();
      return state.posts.filter((post) => {
        if (state.filter !== "all" && post.status !== state.filter) return false;
        if (q && !post.title.includes(q)) return false;
        return true;
      });
    }

    function updateCounts() {
      const counts = {
        all: state.posts.length,
        published: state.posts.filter((post) => post.status === "published").length,
        draft: state.posts.filter((post) => post.status !== "published").length,
      };
      document.querySelectorAll("[data-count]").forEach((node) => {
        node.textContent = String(counts[node.dataset.count] || 0);
      });
    }

    function renderList() {
      updateCounts();
      const posts = visiblePosts();
      const query = $("search").value.trim();
      $("post-list").innerHTML = posts.length ? posts.map((post) => `
        <button class="post ${post.id === state.currentId ? "is-on" : ""}" type="button" data-id="${post.id}">
          <b>${escapeHtml(post.title || "無題")}</b>
          <span class="meta"><i class="dot ${post.status === "published" ? "live" : ""}"></i>${post.status === "published" ? "公開" : "下書き"} · ${escapeHtml(formatDay(post.publishedAt || post.updatedAt))}</span>
        </button>
      `).join("") : `<div class="empty">${query ? "一致する記事はありません" : state.filter === "draft" ? "下書きはありません" : state.filter === "published" ? "公開中の記事はありません" : "まだ記事がありません"}</div>`;
    }

    function absoluteSrc(src) {
      if (!src) return "";
      if (src.startsWith("http") || src.startsWith("data:")) return src;
      if (src.startsWith("/")) return PUBLIC_ORIGIN + src;
      return src;
    }

    function renderPreview() {
      const draft = currentDraft();
      $("preview-date").textContent = formatDay($("published-at").value);
      const category = $("category").selectedOptions[0]?.textContent || "";
      $("preview-cat").textContent = category;
      $("preview-cat").classList.toggle("hidden", !category);
      const html = (draft.coverUrl && !draft.content.includes(draft.coverUrl) ? `<img src="${escapeAttr(draft.coverUrl)}" alt="">` : "") + draft.content;
      $("preview-body").innerHTML = html.replace(/src="([^"]+)"/g, (_, src) => `src="${escapeAttr(absoluteSrc(src))}"`);
      const cover = $("cover-preview");
      const empty = $("cover-empty");
      if (draft.coverUrl) {
        cover.src = absoluteSrc(draft.coverUrl);
        cover.classList.remove("hidden");
        empty.classList.add("hidden");
      } else {
        cover.removeAttribute("src");
        cover.classList.add("hidden");
        empty.classList.remove("hidden");
      }
      $("slug-preview").textContent = draft.slug ? "amalink.co.jp/news/" + draft.slug : "保存するとアドレスが付きます";
      $("remove").textContent = state.currentId ? "この記事を削除" : "入力をクリア";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
    function escapeAttr(value) { return escapeHtml(value); }

    async function surround(tag) {
      const area = $("content");
      const active = document.activeElement === area;
      const start = active ? area.selectionStart : caret.start;
      const end = active ? area.selectionEnd : caret.end;
      const selected = area.value.slice(start, end) || "テキスト";
      let insert = `<${tag}>${selected}</${tag}>`;
      if (tag === "a") {
        $("link-url").value = "https://";
        $("link-dialog").showModal();
        const href = await new Promise((resolve) => {
          $("link-dialog").addEventListener("close", () => {
            resolve($("link-dialog").returnValue === "ok" ? $("link-url").value.trim() : "");
          }, { once: true });
        });
        if (!href) return;
        insert = `<a href="${escapeAttr(href)}">${selected}</a>`;
      }
      if (tag === "ul") insert = `<ul>\n  <li>${selected}</li>\n</ul>`;
      if (!active && start === end && area.value && !area.value.endsWith("\n")) insert = "\n" + insert;
      area.setRangeText(insert, start, end, "end");
      caret = { start: area.selectionStart, end: area.selectionEnd };
      state.dirty = true;
      markDirty();
      renderPreview();
    }

    function showGate() {
      $("boot-status").classList.add("hidden");
      $("auth-form").classList.remove("hidden");
      $("password").focus();
    }

    function confirmLeave(action) {
      if (!state.dirty) {
        action();
        return;
      }
      pendingLeave = action;
      $("leave").showModal();
    }

    async function boot() {
      const me = await api("/api/auth/me");
      state.needsSetup = me.needsSetup;
      if (me.needsSetup) {
        $("auth-title").textContent = "最初のパスワード";
        $("auth-lead").textContent = "この管理画面で使うパスワードを決めてください。10文字以上にしてください。";
        $("confirm-wrap").classList.remove("hidden");
        $("password").autocomplete = "new-password";
        $("auth-submit").textContent = "設定してはじめる";
      }
      if (!me.ok) {
        showGate();
        return;
      }
      await enter();
    }

    async function enter() {
      const [posts, categories] = await Promise.all([api("/api/posts"), api("/api/categories")]);
      state.posts = posts.posts;
      state.categories = categories.categories;
      renderCategories();
      showApp(true);
      if (window.matchMedia("(max-width: 980px)").matches) setPane("list");
      const first = state.posts[0];
      fill(first || blankPost());
    }

    $("auth-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      $("auth-error").textContent = "";
      $("auth-submit").disabled = true;
      try {
        if (state.needsSetup) {
          if ($("password").value !== $("password2").value) {
            $("auth-error").textContent = "確認用パスワードが一致しません。";
            return;
          }
          await api("/api/auth/setup", { method: "POST", body: JSON.stringify({ password: $("password").value }) });
        } else {
          await api("/api/auth/login", { method: "POST", body: JSON.stringify({ password: $("password").value }) });
        }
        $("password").value = "";
        await enter();
      } catch (error) {
        $("auth-error").textContent = error.message === "weak_password"
          ? "10文字以上にしてください。"
          : error.message === "invalid"
            ? "パスワードが違います。"
            : "接続できませんでした。しばらくしてからもう一度お試しください。";
      } finally {
        $("auth-submit").disabled = false;
      }
    });

    $("logout").addEventListener("click", async () => {
      await api("/api/auth/logout", { method: "POST" });
      location.reload();
    });

    $("search").addEventListener("input", renderList);
    document.querySelector(".filters").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      state.filter = button.dataset.filter;
      document.querySelectorAll(".filters button").forEach((item) => item.classList.toggle("is-on", item === button));
      renderList();
    });

    $("post-list").addEventListener("click", (event) => {
      const button = event.target.closest("[data-id]");
      if (!button) return;
      confirmLeave(() => {
        const post = state.posts.find((item) => item.id === button.dataset.id);
        if (post) fill(post);
        if (window.matchMedia("(max-width: 980px)").matches) setPane("edit");
      });
    });

    $("new-post").addEventListener("click", () => {
      confirmLeave(() => {
        fill(blankPost());
        setPane("edit");
        $("title").focus();
      });
    });

    document.querySelector(".dock").addEventListener("click", (event) => {
      const button = event.target.closest("[data-pane]");
      if (!button) return;
      setPane(button.dataset.pane);
    });

    ["title", "slug", "content", "cover", "published-at", "category"].forEach((id) => {
      $(id).addEventListener("input", () => {
        if (id === "title") resizeTitle();
        if (id === "content") rememberCaret();
        state.dirty = true;
        markDirty();
        renderPreview();
      });
    });
    $("content").addEventListener("keyup", rememberCaret);
    $("content").addEventListener("mouseup", rememberCaret);
    $("content").addEventListener("blur", rememberCaret);

    $("status-seg").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      state.status = button.dataset.status;
      document.querySelectorAll("#status-seg button").forEach((item) => item.classList.toggle("is-on", item === button));
      state.dirty = true;
      markDirty();
    });

    $("surface").addEventListener("click", (event) => {
      const button = event.target.closest("[data-surface]");
      if (!button) return;
      $("stage").dataset.surface = button.dataset.surface;
      document.querySelectorAll("#surface button").forEach((item) => item.classList.toggle("is-on", item === button));
      if (button.dataset.surface === "html") $("content").focus();
    });

    document.querySelector(".tools").addEventListener("click", (event) => {
      const button = event.target.closest("[data-insert]");
      if (!button) return;
      surround(button.dataset.insert);
    });

    function askAlt() {
      $("alt-text").value = "";
      $("alt-dialog").showModal();
      return new Promise((resolve) => {
        $("alt-dialog").addEventListener("close", () => {
          resolve($("alt-dialog").returnValue === "ok" ? $("alt-text").value : null);
        }, { once: true });
      });
    }

    async function uploadFile(file, mode) {
      if (!file) return;
      let alt = "";
      if (mode === "body") {
        const entered = await askAlt();
        if (entered === null) return;
        alt = entered;
      }
      const body = new FormData();
      body.append("file", file);
      try {
        const result = await api("/api/media", { method: "POST", body });
        if (mode === "body") {
          const area = $("content");
          const tag = `<img src="${result.url}" alt="${escapeAttr(alt)}">`;
          const start = document.activeElement === area ? area.selectionStart : caret.start;
          const end = document.activeElement === area ? area.selectionEnd : caret.end;
          area.setRangeText(tag, start, end, "end");
          caret = { start: area.selectionStart, end: area.selectionEnd };
        }
        if (mode === "cover" || !$("cover").value) $("cover").value = result.url;
        state.dirty = true;
        markDirty();
        renderPreview();
        toast(mode === "cover" ? "カバー画像を設定しました" : "画像を追加しました");
      } catch (error) {
        const message = error.message === "too_large"
          ? "5MB以下の画像にしてください"
          : error.message === "bad_type"
            ? "PNG、JPEG、WebP、GIF のいずれかにしてください"
            : "画像を追加できませんでした";
        toast(message);
      }
    }

    $("insert-image").addEventListener("click", () => {
      $("file").dataset.mode = "body";
      $("file").click();
    });
    $("upload").addEventListener("click", () => {
      $("file").dataset.mode = "cover";
      $("file").click();
    });
    $("upload").addEventListener("dragover", (event) => {
      event.preventDefault();
      $("upload").classList.add("is-drag");
    });
    $("upload").addEventListener("dragleave", () => $("upload").classList.remove("is-drag"));
    $("upload").addEventListener("drop", (event) => {
      event.preventDefault();
      $("upload").classList.remove("is-drag");
      uploadFile(event.dataTransfer.files[0], "cover");
    });
    $("file").addEventListener("change", () => {
      const file = $("file").files[0];
      const mode = $("file").dataset.mode || "body";
      $("file").value = "";
      uploadFile(file, mode);
    });

    $("add-category").addEventListener("click", async () => {
      const title = $("new-category").value.trim();
      if (!title) return;
      $("add-category").disabled = true;
      try {
        const result = await api("/api/categories", { method: "POST", body: JSON.stringify({ title }) });
        state.categories.push(result.category);
        $("new-category").value = "";
        renderCategories();
        $("category").value = result.category.id;
        state.dirty = true;
        markDirty();
        renderPreview();
        toast("カテゴリを追加しました");
      } catch {
        toast("カテゴリを追加できませんでした");
      } finally {
        $("add-category").disabled = false;
      }
    });

    async function save() {
      const draft = currentDraft();
      if (!draft.title) {
        toast("タイトルを入力してください");
        setPane("edit");
        $("title").focus();
        return false;
      }
      $("save").disabled = true;
      $("save-state").textContent = "保存しています";
      try {
        const path = state.currentId ? "/api/posts/" + state.currentId : "/api/posts";
        const method = state.currentId ? "PUT" : "POST";
        const result = await api(path, { method, body: JSON.stringify(draft) });
        const index = state.posts.findIndex((post) => post.id === result.post.id);
        if (index >= 0) state.posts[index] = result.post;
        else state.posts.unshift(result.post);
        fill(result.post);
        toast(result.post.status === "published" ? "公開しました" : "下書きを保存しました");
        return true;
      } catch (error) {
        const message = error.message === "slug_taken"
          ? "そのアドレスは使われています"
          : error.message === "bad_slug"
            ? "アドレスは英小文字、数字、ハイフン、アンダースコアにしてください"
            : error.status === 401
              ? "ログインの期限が切れました。入り直してください"
              : "保存できませんでした";
        toast(message);
        markDirty();
        return false;
      } finally {
        $("save").disabled = false;
      }
    }

    $("save").addEventListener("click", save);
    document.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        if (!$("app").classList.contains("hidden")) save();
        return;
      }
      if (event.key === "/" && !$("app").classList.contains("hidden") && !event.metaKey && !event.ctrlKey && !event.altKey) {
        const tag = document.activeElement?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        event.preventDefault();
        setPane("list");
        $("search").focus();
      }
    });

    $("remove").addEventListener("click", () => {
      if (!state.currentId) {
        fill(blankPost());
        return;
      }
      $("confirm-copy").textContent = state.status === "published"
        ? "公開ページからも消えます。この操作は戻せません。"
        : "この下書きを削除します。この操作は戻せません。";
      $("confirm").showModal();
    });
    $("confirm-cancel").addEventListener("click", () => $("confirm").close());
    $("confirm-ok").addEventListener("click", async () => {
      $("confirm").close();
      try {
        await api("/api/posts/" + state.currentId, { method: "DELETE" });
        state.posts = state.posts.filter((post) => post.id !== state.currentId);
        toast("削除しました");
        fill(state.posts[0] || blankPost());
      } catch {
        toast("削除できませんでした");
      }
    });

    $("leave").addEventListener("close", () => {
      pendingLeave = null;
    });
    $("leave-cancel").addEventListener("click", () => {
      pendingLeave = null;
      $("leave").close();
    });
    $("leave-discard").addEventListener("click", () => {
      const action = pendingLeave;
      pendingLeave = null;
      state.dirty = false;
      $("leave").close();
      if (action) action();
    });
    $("leave-save").addEventListener("click", async () => {
      const action = pendingLeave;
      pendingLeave = null;
      $("leave").close();
      const ok = await save();
      if (ok && action) action();
    });

    $("password-open").addEventListener("click", () => {
      $("pw-error").textContent = "";
      $("password-dialog").showModal();
      $("pw-current").focus();
    });
    $("pw-cancel").addEventListener("click", () => $("password-dialog").close());
    $("password-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        await api("/api/settings/password", { method: "PUT", body: JSON.stringify({ current: $("pw-current").value, next: $("pw-next").value }) });
        $("password-dialog").close();
        $("password-form").reset();
        toast("パスワードを変更しました");
      } catch (error) {
        $("pw-error").textContent = error.message === "weak_password" ? "10文字以上にしてください。" : "現在のパスワードが違います。";
      }
    });

    window.addEventListener("beforeunload", (event) => {
      if (!state.dirty) return;
      event.preventDefault();
      event.returnValue = "";
    });

    boot().catch(() => {
      showGate();
      $("auth-error").textContent = "管理画面を読み込めませんでした。";
    });
  </script>
</body>
</html>
