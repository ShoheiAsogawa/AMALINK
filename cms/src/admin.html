<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>AMALINK 管理</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #0ea5e9;
      --blue-deep: #0369a1;
      --green: #10b981;
      --ink: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --danger: #be123c;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 0% -10%, rgba(14, 165, 233, 0.16), transparent 60%),
        radial-gradient(700px 380px at 100% 0%, rgba(16, 185, 129, 0.12), transparent 55%),
        var(--bg);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", YuGothic, "Noto Sans JP", sans-serif;
      letter-spacing: 0.01em;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.45; cursor: default; }
    .hidden { display: none !important; }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 14px 22px;
      background: rgba(255,255,255,0.9);
      border-bottom: 1px solid rgba(226,232,240,0.9);
      backdrop-filter: blur(16px);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark {
      width: 36px; height: 36px; border-radius: 12px; flex: none;
      background: linear-gradient(135deg, var(--blue), var(--green));
      color: white; display: grid; place-items: center; font-weight: 700;
    }
    .brand strong { display: block; font-size: 15px; letter-spacing: 0.12em; }
    .brand small { color: var(--muted); font-size: 12px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn, .btn-ghost, .btn-danger {
      height: 36px; padding: 0 14px; border-radius: 999px; border: 0;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      text-decoration: none; font-size: 13px; font-weight: 650;
    }
    .btn { background: linear-gradient(105deg, var(--blue), #06b6d4 45%, var(--green)); color: white; }
    .btn:hover { filter: brightness(1.05); }
    .btn-ghost { background: white; color: var(--ink); border: 1px solid var(--line); }
    .btn-ghost:hover { border-color: #bae6fd; color: var(--blue-deep); }
    .btn-danger { background: white; color: var(--danger); border: 1px solid #fecdd3; }
    .text-btn { border: 0; background: transparent; color: var(--muted); height: 32px; padding: 0 8px; border-radius: 8px; }
    .text-btn:hover { background: #f1f5f9; color: var(--ink); }
    .gate {
      min-height: calc(100vh - 65px);
      display: grid; place-items: center; padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid rgba(226,232,240,0.9);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 28px;
    }
    .card h1 { margin: 0 0 8px; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 28px; font-weight: 500; }
    .lead { margin: 0 0 22px; color: var(--muted); line-height: 1.7; font-size: 14px; }
    label { display: grid; gap: 6px; font-size: 12px; font-weight: 700; color: #475569; }
    input, textarea, select {
      width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 11px 12px;
    }
    input:focus, textarea:focus, select:focus { outline: 2px solid rgba(14,165,233,0.35); border-color: #7dd3fc; }
    .stack { display: grid; gap: 14px; }
    .error { min-height: 1.2em; margin: 0; color: var(--danger); font-size: 13px; }
    .workspace {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 18px;
      padding: 18px;
      align-items: start;
    }
    .sidebar, .editor, .preview, .side {
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(226,232,240,0.95);
      border-radius: 22px;
    }
    .sidebar { padding: 14px; position: sticky; top: 84px; max-height: calc(100vh - 102px); display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); gap: 10px; }
    .filters { display: flex; gap: 4px; padding: 4px; background: #eef6fb; border-radius: 999px; }
    .filters button { flex: 1; height: 30px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; }
    .filters button.is-on { background: white; color: var(--ink); box-shadow: 0 1px 2px rgba(15,23,42,0.08); }
    .posts { overflow: auto; display: grid; gap: 8px; align-content: start; padding-right: 2px; }
    .post {
      text-align: left; width: 100%; border: 1px solid var(--line); background: white; border-radius: 16px; padding: 12px;
    }
    .post:hover { border-color: #bae6fd; }
    .post.is-on { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(14,165,233,0.15); }
    .post b { display: block; font-weight: 700; line-height: 1.45; }
    .post span { display: flex; gap: 6px; align-items: center; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .badge { border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .badge.live { background: #d1fae5; color: #047857; }
    .badge.draft { background: #f1f5f9; color: #475569; }
    .editor-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; min-width: 0; }
    .editor { padding: 18px; display: grid; gap: 12px; }
    .title {
      border: 0; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-size: 28px; font-weight: 500; padding: 4px 2px; border-radius: 0;
      resize: none; overflow: hidden; line-height: 1.45; min-height: 44px;
    }
    .title:focus { outline: none; }
    .tools { display: flex; flex-wrap: wrap; gap: 6px; }
    .tools button { height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: #f8fafc; font-size: 12px; }
    .tools button:hover { border-color: #7dd3fc; color: var(--blue-deep); }
    textarea.content { min-height: 180px; max-height: 240px; resize: vertical; line-height: 1.7; font-size: 13px; }
    .preview { padding: 18px 18px 8px; min-height: 280px; max-height: 460px; overflow: auto; background: #f8fafc; }
    .preview .kicker { color: var(--green); font-size: 11px; letter-spacing: 0.18em; font-weight: 700; }
    .preview h2 { margin: 8px 0 14px; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 500; font-size: 26px; line-height: 1.45; }
    .preview time { color: var(--muted); font-size: 13px; }
    .prose { margin-top: 18px; line-height: 1.9; color: #334155; }
    .prose p { margin: 0 0 14px; }
    .prose h2, .prose h3 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 500; }
    .prose a { color: var(--blue-deep); }
    .prose img { width: 100%; border-radius: 16px; margin: 8px 0 16px; }
    .prose ul { padding-left: 1.2em; }
    .side { padding: 16px; display: grid; gap: 12px; align-content: start; position: sticky; top: 84px; max-height: calc(100vh - 102px); overflow: auto; }
    .side h3 { margin: 0; font-size: 13px; letter-spacing: 0.08em; color: var(--muted); }
    .seg { display: flex; padding: 4px; background: #eef6fb; border-radius: 999px; }
    .seg button { flex: 1; height: 32px; border: 0; border-radius: 999px; background: transparent; font-weight: 700; font-size: 13px; }
    .seg button.is-on { background: white; box-shadow: 0 1px 2px rgba(15,23,42,0.08); }
    .status-line { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
    .empty { padding: 28px 12px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .cover-preview { width: 100%; max-height: 140px; object-fit: cover; border-radius: 14px; border: 1px solid var(--line); background: #f8fafc; }
    .boot { margin: 0; color: var(--muted); font-size: 14px; }
    .toast {
      position: fixed; right: 18px; bottom: 18px; z-index: 40;
      background: #0f172a; color: white; border-radius: 14px; padding: 12px 16px;
      box-shadow: var(--shadow); font-size: 13px;
    }
    dialog { border: 0; border-radius: 22px; padding: 22px; width: min(420px, calc(100% - 32px)); box-shadow: var(--shadow); }
    dialog::backdrop { background: rgba(15, 23, 42, 0.35); }
    dialog h2 { margin: 0 0 8px; font-size: 20px; }
    dialog p { margin: 0 0 16px; color: var(--muted); line-height: 1.6; font-size: 14px; }
    .row input { width: auto; flex: 1; min-width: 140px; }
    @media (max-width: 980px) {
      .workspace, .editor-wrap { grid-template-columns: 1fr; }
      .sidebar, .side { position: static; max-height: none; }
      .title { font-size: 22px; }
      .topbar { flex-wrap: wrap; align-items: center; padding: 12px 14px; }
      .brand { flex: none; }
      .brand small { display: none; }
      .brand strong { letter-spacing: 0.08em; }
      #top-actions { width: 100%; justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">A</div>
      <div>
        <strong>AMALINK</strong>
        <small>お知らせの管理</small>
      </div>
    </div>
    <div class="row" id="top-actions">
      <a class="btn-ghost" href="https://amalink.co.jp/news" target="_blank" rel="noreferrer">公開サイト</a>
      <button class="text-btn hidden" id="password-open" type="button">パスワード</button>
      <button class="text-btn hidden" id="logout" type="button">ログアウト</button>
    </div>
  </header>

  <main id="gate" class="gate">
    <p id="boot-status" class="boot">読み込んでいます</p>
    <form class="card stack hidden" id="auth-form">
      <div>
        <h1 id="auth-title">管理画面</h1>
        <p class="lead" id="auth-lead">公開中のお知らせを、ここから編集できます。</p>
      </div>
      <label>パスワード<input id="password" type="password" autocomplete="current-password" required /></label>
      <label class="hidden" id="confirm-wrap">確認<input id="password2" type="password" autocomplete="new-password" /></label>
      <p class="error" id="auth-error" role="alert"></p>
      <button class="btn" type="submit" id="auth-submit">入る</button>
    </form>
  </main>

  <section id="app" class="workspace hidden">
    <aside class="sidebar">
      <button class="btn" id="new-post" type="button">新しい記事</button>
      <input id="search" type="search" placeholder="タイトルを検索" />
      <div class="filters" role="tablist">
        <button type="button" data-filter="all" class="is-on">すべて</button>
        <button type="button" data-filter="published">公開</button>
        <button type="button" data-filter="draft">下書き</button>
      </div>
      <div class="posts" id="post-list"></div>
    </aside>
    <div class="editor-wrap">
      <div class="editor">
        <textarea class="title" id="title" rows="2" placeholder="タイトル"></textarea>
        <div class="tools">
          <button type="button" data-insert="p">段落</button>
          <button type="button" data-insert="h2">見出し</button>
          <button type="button" data-insert="h3">小見出し</button>
          <button type="button" data-insert="a">リンク</button>
          <button type="button" data-insert="ul">箇条書き</button>
          <button type="button" id="insert-image" >画像</button>
        </div>
        <article class="preview">
          <div class="kicker">プレビュー</div>
          <time id="preview-date"></time>
          <h2 id="preview-title">無題の記事</h2>
          <div class="prose" id="preview-body"></div>
        </article>
        <textarea class="content" id="content" placeholder="本文（HTML）"></textarea>
        <p class="hint">上は公開ページと同じ見た目です。下のHTMLを直すとすぐ反映されます。保存は ⌘S / Ctrl+S です。</p>
      </div>
      <aside class="side">
        <h3>公開設定</h3>
        <div class="seg" id="status-seg">
          <button type="button" data-status="draft">下書き</button>
          <button type="button" data-status="published" class="is-on">公開</button>
        </div>
        <label>公開日<input id="published-at" type="date" /></label>
        <label>スラッグ<input id="slug" placeholder="自動で付きます" spellcheck="false" /></label>
        <label>カテゴリ
          <select id="category"></select>
        </label>
        <div class="row">
          <input id="new-category" placeholder="カテゴリを追加" />
          <button class="btn-ghost" id="add-category" type="button">追加</button>
        </div>
        <label>カバー画像URL<input id="cover" placeholder="https:// または /news/..." /></label>
        <img id="cover-preview" class="cover-preview hidden" alt="" />
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden" />
        <button class="btn-ghost" id="upload" type="button">カバー画像をアップロード</button>
        <button class="btn" id="save" type="button">保存する</button>
        <a class="btn-ghost" id="open-public" href="https://amalink.co.jp/news" target="_blank" rel="noreferrer">公開ページを見る</a>
        <button class="btn-danger" id="remove" type="button">この記事を削除</button>
        <div class="status-line"><span id="save-state">未保存の変更はありません</span><span id="dirty"></span></div>
      </aside>
    </div>
  </section>

  <dialog id="confirm">
    <h2>この記事を削除しますか？</h2>
    <p>公開ページからも消えます。この操作は戻せません。</p>
    <div class="row">
      <button class="btn-ghost" id="confirm-cancel" type="button">やめる</button>
      <button class="btn-danger" id="confirm-ok" type="button">削除する</button>
    </div>
  </dialog>

  <dialog id="password-dialog">
    <form class="stack" id="password-form">
      <h2>パスワードを変更</h2>
      <label>現在のパスワード<input id="pw-current" type="password" required /></label>
      <label>新しいパスワード<input id="pw-next" type="password" minlength="10" required /></label>
      <p class="error" id="pw-error"></p>
      <div class="row">
        <button class="btn-ghost" id="pw-cancel" type="button">閉じる</button>
        <button class="btn" type="submit">変更する</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden" role="status"></div>

  <script>
    const PUBLIC_ORIGIN = "https://amalink.co.jp";
    const state = { posts: [], categories: [], filter: "all", currentId: null, dirty: false, status: "published", needsSetup: false };

    const $ = (id) => document.getElementById(id);
    const toastBox = $("toast");
    let toastTimer = 0;

    function toast(message) {
      toastBox.textContent = message;
      toastBox.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastBox.classList.add("hidden"), 2400);
    }

    async function api(path, options = {}) {
      const headers = new Headers(options.headers || {});
      if (options.body && !(options.body instanceof FormData) && !headers.has("content-type")) {
        headers.set("content-type", "application/json");
      }
      const response = await fetch(path, { ...options, headers });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(data.error || "request_failed");
        error.status = response.status;
        throw error;
      }
      return data;
    }

    function showApp(on) {
      $("gate").classList.toggle("hidden", on);
      $("app").classList.toggle("hidden", !on);
      $("logout").classList.toggle("hidden", !on);
      $("password-open").classList.toggle("hidden", !on);
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function blankPost() {
      return { id: null, title: "", slug: "", content: "", categoryId: state.categories[0]?.id || "", status: "draft", publishedAt: today() + "T00:00:00.000Z", coverUrl: "" };
    }

    function currentDraft() {
      return {
        title: $("title").value.trim(),
        slug: $("slug").value.trim(),
        content: $("content").value,
        categoryId: $("category").value,
        status: state.status,
        publishedAt: $("published-at").value ? $("published-at").value + "T00:00:00.000Z" : null,
        coverUrl: $("cover").value.trim(),
      };
    }

    function prettyHtml(html) {
      return String(html || "").replace(/></g, ">\n<").trim();
    }

    function resizeTitle() {
      const title = $("title");
      title.style.height = "auto";
      title.style.height = title.scrollHeight + "px";
    }

    function fill(post) {
      state.currentId = post.id;
      state.status = post.status || "draft";
      $("title").value = post.title || "";
      resizeTitle();
      $("slug").value = post.slug || "";
      $("content").value = prettyHtml(post.content || "");
      $("cover").value = post.coverUrl || "";
      $("published-at").value = (post.publishedAt || "").slice(0, 10) || today();
      $("category").value = post.categoryId || "";
      document.querySelectorAll("#status-seg button").forEach((button) => {
        button.classList.toggle("is-on", button.dataset.status === state.status);
      });
      const href = post.publicUrl || (post.slug ? PUBLIC_ORIGIN + "/news/" + post.slug : PUBLIC_ORIGIN + "/news");
      $("open-public").href = href;
      state.dirty = false;
      markDirty();
      renderPreview();
      renderList();
    }

    function markDirty() {
      $("dirty").textContent = state.dirty ? "未保存" : "";
      $("save-state").textContent = state.dirty ? "変更があります" : "保存済み";
    }

    function renderCategories() {
      const select = $("category");
      const current = select.value;
      select.innerHTML = state.categories.map((category) => `<option value="${category.id}">${escapeHtml(category.title)}</option>`).join("");
      if (current) select.value = current;
    }

    function visiblePosts() {
      const q = $("search").value.trim();
      return state.posts.filter((post) => {
        if (state.filter !== "all" && post.status !== state.filter) return false;
        if (q && !post.title.includes(q)) return false;
        return true;
      });
    }

    function renderList() {
      const posts = visiblePosts();
      $("post-list").innerHTML = posts.length ? posts.map((post) => `
        <button class="post ${post.id === state.currentId ? "is-on" : ""}" type="button" data-id="${post.id}">
          <b>${escapeHtml(post.title || "無題")}</b>
          <span><i class="badge ${post.status === "published" ? "live" : "draft"}">${post.status === "published" ? "公開" : "下書き"}</i>${escapeHtml((post.publishedAt || post.updatedAt || "").slice(0, 10))}</span>
        </button>
      `).join("") : `<div class="empty">該当する記事はありません</div>`;
    }

    function absoluteSrc(src) {
      if (!src) return "";
      if (src.startsWith("http") || src.startsWith("data:")) return src;
      if (src.startsWith("/")) return PUBLIC_ORIGIN + src;
      return src;
    }

    function renderPreview() {
      const draft = currentDraft();
      $("preview-title").textContent = draft.title || "無題の記事";
      $("preview-date").textContent = ($("published-at").value || "").replaceAll("-", "/");
      const html = (draft.coverUrl && !draft.content.includes(draft.coverUrl) ? `<img src="${escapeAttr(draft.coverUrl)}" alt="">` : "") + draft.content;
      $("preview-body").innerHTML = html.replace(/src="([^"]+)"/g, (_, src) => `src="${escapeAttr(absoluteSrc(src))}"`);
      const cover = $("cover-preview");
      if (draft.coverUrl) {
        cover.src = absoluteSrc(draft.coverUrl);
        cover.classList.remove("hidden");
      } else {
        cover.removeAttribute("src");
        cover.classList.add("hidden");
      }
      $("remove").textContent = state.currentId ? "この記事を削除" : "入力をクリア";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
    function escapeAttr(value) { return escapeHtml(value); }

    function surround(tag) {
      const area = $("content");
      const start = area.selectionStart;
      const end = area.selectionEnd;
      const selected = area.value.slice(start, end) || "テキスト";
      let insert = `<${tag}>${selected}</${tag}>`;
      if (tag === "a") {
        const href = window.prompt("リンク先URL", "https://amalink.co.jp/");
        if (!href) return;
        insert = `<a href="${escapeAttr(href)}">${selected}</a>`;
      }
      if (tag === "ul") insert = `<ul>\n  <li>${selected}</li>\n</ul>`;
      area.setRangeText(insert, start, end, "end");
      state.dirty = true;
      markDirty();
      renderPreview();
    }

    function showGate() {
      $("boot-status").classList.add("hidden");
      $("auth-form").classList.remove("hidden");
    }

    async function boot() {
      const me = await api("/api/auth/me");
      state.needsSetup = me.needsSetup;
      if (me.needsSetup) {
        $("auth-title").textContent = "最初のパスワード";
        $("auth-lead").textContent = "この管理画面で使うパスワードを決めてください。10文字以上にしてください。";
        $("confirm-wrap").classList.remove("hidden");
        $("password").autocomplete = "new-password";
        $("auth-submit").textContent = "設定してはじめる";
      }
      if (!me.ok) {
        showGate();
        return;
      }
      await enter();
    }

    async function enter() {
      const [posts, categories] = await Promise.all([api("/api/posts"), api("/api/categories")]);
      state.posts = posts.posts;
      state.categories = categories.categories;
      renderCategories();
      showApp(true);
      const first = state.posts[0];
      fill(first || blankPost());
    }

    $("auth-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      $("auth-error").textContent = "";
      try {
        if (state.needsSetup) {
          if ($("password").value !== $("password2").value) {
            $("auth-error").textContent = "確認用パスワードが一致しません。";
            return;
          }
          await api("/api/auth/setup", { method: "POST", body: JSON.stringify({ password: $("password").value }) });
        } else {
          await api("/api/auth/login", { method: "POST", body: JSON.stringify({ password: $("password").value }) });
        }
        $("password").value = "";
        await enter();
      } catch (error) {
        $("auth-error").textContent = error.message === "weak_password"
          ? "10文字以上にしてください。"
          : error.message === "invalid"
            ? "パスワードが違います。"
            : "接続できませんでした。しばらくしてからもう一度お試しください。";
      }
    });

    $("logout").addEventListener("click", async () => {
      await api("/api/auth/logout", { method: "POST" });
      location.reload();
    });

    $("search").addEventListener("input", renderList);
    document.querySelector(".filters").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      state.filter = button.dataset.filter;
      document.querySelectorAll(".filters button").forEach((item) => item.classList.toggle("is-on", item === button));
      renderList();
    });

    $("post-list").addEventListener("click", (event) => {
      const button = event.target.closest("[data-id]");
      if (!button) return;
      if (state.dirty && !window.confirm("保存していない変更があります。移動しますか？")) return;
      const post = state.posts.find((item) => item.id === button.dataset.id);
      if (post) fill(post);
    });

    $("new-post").addEventListener("click", () => {
      if (state.dirty && !window.confirm("保存していない変更があります。新しい記事にしますか？")) return;
      fill(blankPost());
      $("title").focus();
    });

    ["title", "slug", "content", "cover", "published-at", "category"].forEach((id) => {
      $(id).addEventListener("input", () => {
        if (id === "title") resizeTitle();
        state.dirty = true;
        markDirty();
        renderPreview();
      });
    });

    $("status-seg").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      state.status = button.dataset.status;
      document.querySelectorAll("#status-seg button").forEach((item) => item.classList.toggle("is-on", item === button));
      state.dirty = true;
      markDirty();
    });

    document.querySelector(".tools").addEventListener("click", (event) => {
      const button = event.target.closest("[data-insert]");
      if (!button) return;
      surround(button.dataset.insert);
    });

    $("insert-image").addEventListener("click", () => {
      $("file").dataset.mode = "body";
      $("file").click();
    });
    $("upload").addEventListener("click", () => {
      $("file").dataset.mode = "cover";
      $("file").click();
    });
    $("file").addEventListener("change", async () => {
      const file = $("file").files[0];
      const mode = $("file").dataset.mode || "body";
      $("file").value = "";
      if (!file) return;
      let alt = "";
      if (mode === "body") {
        const entered = window.prompt("画像の説明（読み上げや検索に使います）", "");
        if (entered === null) return;
        alt = entered;
      }
      const body = new FormData();
      body.append("file", file);
      try {
        const result = await api("/api/media", { method: "POST", body });
        if (mode === "body") {
          const area = $("content");
          const tag = `<img src="${result.url}" alt="${escapeAttr(alt)}">`;
          area.setRangeText(tag, area.selectionStart, area.selectionEnd, "end");
        }
        if (mode === "cover" || !$("cover").value) $("cover").value = result.url;
        state.dirty = true;
        markDirty();
        renderPreview();
        toast(mode === "cover" ? "カバー画像を設定しました" : "画像を追加しました");
      } catch (error) {
        const message = error.message === "too_large"
          ? "5MB以下の画像にしてください"
          : error.message === "bad_type"
            ? "PNG、JPEG、WebP、GIF のいずれかにしてください"
            : "画像を追加できませんでした";
        toast(message);
      }
    });

    $("add-category").addEventListener("click", async () => {
      const title = $("new-category").value.trim();
      if (!title) return;
      $("add-category").disabled = true;
      try {
        const result = await api("/api/categories", { method: "POST", body: JSON.stringify({ title }) });
        state.categories.push(result.category);
        $("new-category").value = "";
        renderCategories();
        $("category").value = result.category.id;
        state.dirty = true;
        markDirty();
        toast("カテゴリを追加しました");
      } catch {
        toast("カテゴリを追加できませんでした");
      } finally {
        $("add-category").disabled = false;
      }
    });

    async function save() {
      const draft = currentDraft();
      if (!draft.title) {
        toast("タイトルを入力してください");
        $("title").focus();
        return;
      }
      $("save").disabled = true;
      $("save-state").textContent = "保存しています";
      try {
        const path = state.currentId ? "/api/posts/" + state.currentId : "/api/posts";
        const method = state.currentId ? "PUT" : "POST";
        const result = await api(path, { method, body: JSON.stringify(draft) });
        const index = state.posts.findIndex((post) => post.id === result.post.id);
        if (index >= 0) state.posts[index] = result.post;
        else state.posts.unshift(result.post);
        fill(result.post);
        toast(result.post.status === "published" ? "公開しました" : "下書きを保存しました");
      } catch (error) {
        const message = error.message === "slug_taken"
          ? "そのスラッグは使われています"
          : error.message === "bad_slug"
            ? "スラッグは英小文字・数字・ハイフン・アンダースコアにしてください"
            : error.status === 401
              ? "ログインの期限が切れました。入り直してください"
              : "保存できませんでした";
        toast(message);
        markDirty();
      } finally {
        $("save").disabled = false;
      }
    }

    $("save").addEventListener("click", save);
    document.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "s") {
        event.preventDefault();
        if (!$("app").classList.contains("hidden")) save();
      }
    });

    $("remove").addEventListener("click", () => {
      if (!state.currentId) {
        fill(blankPost());
        return;
      }
      $("confirm").showModal();
    });
    $("confirm-cancel").addEventListener("click", () => $("confirm").close());
    $("confirm-ok").addEventListener("click", async () => {
      $("confirm").close();
      try {
        await api("/api/posts/" + state.currentId, { method: "DELETE" });
        state.posts = state.posts.filter((post) => post.id !== state.currentId);
        toast("削除しました");
        fill(state.posts[0] || blankPost());
      } catch {
        toast("削除できませんでした");
      }
    });

    $("password-open").addEventListener("click", () => {
      $("pw-error").textContent = "";
      $("password-dialog").showModal();
    });
    $("pw-cancel").addEventListener("click", () => $("password-dialog").close());
    $("password-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        await api("/api/settings/password", { method: "PUT", body: JSON.stringify({ current: $("pw-current").value, next: $("pw-next").value }) });
        $("password-dialog").close();
        $("password-form").reset();
        toast("パスワードを変更しました");
      } catch (error) {
        $("pw-error").textContent = error.message === "weak_password" ? "10文字以上にしてください。" : "現在のパスワードが違います。";
      }
    });

    window.addEventListener("beforeunload", (event) => {
      if (!state.dirty) return;
      event.preventDefault();
      event.returnValue = "";
    });

    boot().catch(() => {
      showGate();
      $("auth-error").textContent = "管理画面を読み込めませんでした。";
    });
  </script>
</body>
</html>
